[workspace]
resolver = "2"
members = ["crates/flicker-core", "crates/flicker-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

# Debug info: file and line numbers for our code, none for dependencies,
# or the build folder grows by tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
