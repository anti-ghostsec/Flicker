# Every push to master that passes the checks publishes Flicker for Linux
# (x86_64), signed with minisign, as the newest release. FerroOS's updater can
# install it from there, and only if the signature checks out against
# Flicker's public key (minisign.pub, to be built into the updater).
#
# Until minisign.pub holds a real key and the MINISIGN_SECRET_KEY secret is
# set, this workflow stops before publishing anything.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    # Only master is ever built, signed and published, also when the
    # workflow is started by hand from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit, not a tag that can be moved.
      # The token isn't left in .git for the build to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Checked before the (slow) build, so a missing key fails fast.
      - name: Check signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY isn't set: no release without a signature" >&2; exit 1; }
          if grep -q PLACEHOLDER minisign.pub; then
              echo "minisign.pub is still the placeholder: put Flicker's real public key there first" >&2
              exit 1
          fi

      # The end-to-end tests drive the real ffmpeg.
      - name: Test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg >/dev/null
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and pack
        run: |
          cargo build --locked --release -p flicker-app
          rm -rf dist && mkdir -p dist/flicker
          cp target/release/flicker README.md ROADMAP.md dist/flicker/
          strip dist/flicker/flicker
          echo "$GITHUB_SHA" >dist/flicker/commit
          echo "$GITHUB_SHA" >dist/flicker-commit
          # Plain files and folders only, owned by nobody in particular.
          tar --owner=0 --group=0 --numeric-owner --mode=u=rwX,go=rX -C dist -czf dist/flicker-linux.tar.gz flicker
          (cd dist && sha256sum flicker-linux.tar.gz >flicker-linux.tar.gz.sha256)

      # The trusted comment names the commit and its time, so the updater
      # can tell this build is the one it was told about, and never goes
      # back to an older one.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get install -y -q minisign >/dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          when=$(git log -1 --format=%ct "$GITHUB_SHA")
          minisign -S -s "$key" -m dist/flicker-linux.tar.gz -t "flicker $GITHUB_SHA $when"
          # Signed with the key the updater trusts, not some other one.
          minisign -V -p minisign.pub -m dist/flicker-linux.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "build-$short" --target "$GITHUB_SHA" --latest \
            --title "Flicker $short" \
            --notes "Flicker for Linux (x86_64), from $GITHUB_SHA. Needs ffmpeg and ffprobe. Signed with minisign: minisign -Vm flicker-linux.tar.gz -P $(tail -1 minisign.pub)" \
            dist/flicker-linux.tar.gz dist/flicker-linux.tar.gz.sha256 \
            dist/flicker-linux.tar.gz.minisig dist/flicker-commit
