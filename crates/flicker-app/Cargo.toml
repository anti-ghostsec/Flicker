[package]
name = "flicker-app"
description = "Flicker desktop/mobile GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flicker"
path = "src/main.rs"

[dependencies]
flicker-core = { path = "../flicker-core" }
eframe = "0.37"
# The project password is wiped from memory when it's no longer needed.
zeroize = "1"

# Native file dialogs exist on desktop only; Android will use the system picker.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"
